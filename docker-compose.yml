services:
  mysql:
    image: mysql:lts
    container_name: mysql-ssm2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "!P@ssword"
      MYSQL_DATABASE: db_mybatis
      MYSQL_USER: breeze
      MYSQL_PASSWORD: "!P@ssword"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
